[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grit"
version = "0.1.0"
description = "Genome curation pipeline notebook library"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.28",
    "rich-click>=1.8.0",
]

[tool.uv]
package = true

[project.scripts]
grit = "grit.core.click_cli:cli"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
