[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grit"
version = "0.4.1"
description = "Genome curation pipeline CLI"
requires-python = ">=3.10"
dependencies = [
    "biopython>=1.80",
    "pymysql>=1.0",
    "pyyaml>=6.0",
    "requests>=2.28",
    "rich-click>=1.8.0",
    "rename-and-orient>=1.2.2",
]

[tool.uv.sources]
rename-and-orient = { git = "https://github.com/zilov/rename-and-orient" }

[tool.uv]
package = true

[project.scripts]
grit = "grit.core.click_cli:cli"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.3",
]

[tool.ruff]
line-length = 100
# Planning docs are prose; ruff formats Python code blocks inside Markdown, which
# would make CI fail over an illustrative snippet in a design note.
extend-exclude = ["TODO/"]

[tool.ruff.lint]
select = ["E", "F", "I"]
