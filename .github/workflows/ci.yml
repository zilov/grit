name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Run tests
        run: uv run pytest tests/ -v

      # The canonical-FASTA regression check: real curator pipelines run twice
      # against the isolated ~/.grit/dry_run/ sandbox, once straight through and
      # once with steps re-run out of order. Its farm-only section skips itself
      # when /lustre is absent, so the runner executes the dry-run scenarios.
      - name: Smoke test (dry-run scenarios)
        run: uv run bash tests/local_smoke_test.sh

      # Regression guard for the 0.3.4 bug (CHANGELOG): bundled non-.py files
      # (grit/config/sanger_template.yaml, grit/scripts/*) only reach a real
      # install through the built wheel, never through the tests above, which
      # run against the checked-out source tree.
      - name: Build package
        run: uv build

      - name: Verify packaged data files ship in the wheel
        run: |
          wheel=$(ls dist/*.whl)
          python3 -c "
          import sys, zipfile
          wheel = sys.argv[1]
          required = ['grit/config/sanger_template.yaml']
          with zipfile.ZipFile(wheel) as zf:
              names = set(zf.namelist())
          missing = [f for f in required if f not in names]
          if missing:
              print(f'Missing from {wheel}: {missing}', file=sys.stderr)
              sys.exit(1)
          scripts = [n for n in names if n.startswith('grit/scripts/')]
          if not scripts:
              print(f'No grit/scripts/* files found in {wheel}', file=sys.stderr)
              sys.exit(1)
          print(f'OK: {wheel} contains {required} and {len(scripts)} scripts/ files')
          " "$wheel"
